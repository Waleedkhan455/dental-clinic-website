name: Repo Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: Waleedkhan455/repo-reviewer@0fdedd21715ffd89f8f1db8127c9150304fd5fab
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          fail-on: none
